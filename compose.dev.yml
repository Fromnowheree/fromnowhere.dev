# Local development only: the database, and a mail catcher for the contact form.
# Run the app itself with `pnpm dev` (or `pnpm dev:mail` to send the form to the catcher).
# Usage: docker compose -f compose.dev.yml up -d

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: fnw
      POSTGRES_PASSWORD: fnw
      POSTGRES_DB: fnw
    # This machine only: the password above is no secret.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  # Catches what the contact form sends: nothing leaves this machine. SMTP on 1025 with STARTTLS
  # required and a certificate from ./scripts/dev-mail.sh (run it first); read the messages at
  # http://localhost:8025. Any login is accepted, but only after STARTTLS.
  mail:
    image: docker.io/axllent/mailpit:v1.33.1
    command:
      - --smtp-tls-cert=/certs/mail.crt
      - --smtp-tls-key=/certs/mail.key
      - --smtp-require-starttls
      - --smtp-auth-accept-any
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    volumes:
      - ./.dev/mail:/certs:ro,Z

volumes:
  pgdata-dev:
