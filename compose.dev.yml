# Local development database only. Run the app itself with `pnpm dev`.
# Usage: docker compose -f compose.dev.yml up -d

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: fnw
      POSTGRES_PASSWORD: fnw
      POSTGRES_DB: fnw
    # This machine only: the password above is no secret.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
